name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Generate lab certificates
        run: bash scripts/gen-certs.sh
      - name: Validate configs
        run: |
          docker compose config -q
          docker run --rm -v "$PWD/haproxy:/cfg:ro" haproxy:3.0-alpine haproxy -c -f /cfg/haproxy.cfg
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Edge tests (TLS, failover, rate limit)
        run: bash scripts/test-edge.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v