global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  option redispatch          # a failed connection is retried on another server
  retries 2
  timeout connect 3s
  timeout client 30s
  timeout server 30s
  # start even if a backend name does not resolve yet
  default-server init-addr last,libc,none check inter 2s fall 2 rise 2 resolvers docker

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend fe_app
  bind :8080
  default_backend be_app

backend be_app
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  server app1 app1:80
  server app2 app2:80
  server app3 app3:80

listen stats
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 5s
