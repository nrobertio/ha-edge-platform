# Edge: TLS termination, HTTP to HTTPS redirect, host and path routing, rate limits.

limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_status 429;

upstream app_pool {
  server haproxy:8080;
  keepalive 16;
}

upstream api_pool {
  server api:80;
  keepalive 8;
}

# Port 80: health endpoint for the container check, everything else goes to HTTPS.
server {
  listen 80 default_server;
  server_name _;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

# Unknown hosts on 443 are rejected instead of served by accident.
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  return 421;
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.local.test;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  location / {
    limit_req zone=web burst=100 nodelay;
    proxy_pass http://app_pool;
  }

  # Path routing: /api/ goes to a separate service, with a stricter rate limit.
  location /api/ {
    limit_req zone=api burst=5 nodelay;
    proxy_pass http://api_pool/;
  }
}