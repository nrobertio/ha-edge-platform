global_defs {
  router_id lb2
  enable_script_security
  script_user root
}

vrrp_script chk_haproxy {
  script "/usr/local/bin/chk_haproxy.sh"
  interval 1
  fall 2
  rise 2
}

vrrp_instance VI_EDGE {
  state BACKUP
  interface eth0
  virtual_router_id 51
  priority 100
  advert_int 1
  nopreempt
  unicast_src_ip 172.30.0.12
  unicast_peer {
    172.30.0.11
  }
  virtual_ipaddress {
    172.30.0.100/24
  }
  track_script {
    chk_haproxy
  }
}
